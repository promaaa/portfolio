<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LED Matrix Driver Architecture - IS31FL3731 + TCA9548A I2C Multiplexer">
    <defs>
        <style>
            :root {
                --bg: #f7f7fb;
                --ink: #0a0a0e;
                --muted: #5e5e69;
                --line: rgba(0, 0, 0, 0.08);
                --accent: #5b5bd6;
                --accent2: #ff6b6b;
                --accent3: #4ecdc4;
                --surface: rgba(255, 255, 255, 0.7);
            }
            [data-theme="dark"] {
                --bg: #0b0e16;
                --ink: #f7f7fb;
                --muted: #b5b7c8;
                --line: rgba(255, 255, 255, 0.1);
                --accent: #8bbcff;
                --accent2: #ff8787;
                --accent3: #6fded6;
                --surface: rgba(255, 255, 255, 0.06);
            }
            .wire {
                stroke: var(--ink);
                stroke-width: 2;
                fill: none;
            }
            .wire-i2c {
                stroke: var(--accent);
                stroke-width: 2.5;
                fill: none;
            }
            .wire-power {
                stroke: var(--accent2);
                stroke-width: 2.5;
                fill: none;
            }
            .wire-data {
                stroke: var(--accent3);
                stroke-width: 2;
                fill: none;
            }
            .component {
                fill: var(--surface);
                stroke: var(--ink);
                stroke-width: 2;
            }
            .ic-body {
                fill: var(--surface);
                stroke: var(--ink);
                stroke-width: 2;
                rx: 4;
            }
            .label {
                font-family: 'Inter', sans-serif;
                font-size: 11px;
                fill: var(--ink);
                font-weight: 500;
            }
            .label-small {
                font-family: 'Inter', sans-serif;
                font-size: 9px;
                fill: var(--muted);
                font-weight: 400;
            }
            .title {
                font-family: 'Inter', sans-serif;
                font-size: 18px;
                fill: var(--ink);
                font-weight: 700;
            }
            .subtitle {
                font-family: 'Inter', sans-serif;
                font-size: 13px;
                fill: var(--muted);
                font-weight: 500;
            }
            .pin-label {
                font-family: 'Inter', sans-serif;
                font-size: 10px;
                fill: var(--accent);
                font-weight: 600;
            }
            .ic-label {
                font-family: 'Inter', sans-serif;
                font-size: 12px;
                fill: var(--ink);
                font-weight: 600;
            }
            .node {
                fill: var(--ink);
            }
            .node-i2c {
                fill: var(--accent);
            }
            .led-symbol {
                fill: none;
                stroke: var(--accent2);
                stroke-width: 2;
            }
            .arrow {
                fill: var(--muted);
            }
        </style>

        <!-- LED Symbol -->
        <g id="led">
            <circle cx="0" cy="0" r="4" class="led-symbol"/>
            <line x1="-4" y1="-4" x2="4" y2="4" class="led-symbol"/>
            <line x1="-4" y1="4" x2="4" y2="-4" class="led-symbol"/>
        </g>

        <!-- Arrow marker -->
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" class="arrow"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="1000" height="800" fill="var(--bg)"/>

    <!-- Title Block -->
    <text x="500" y="30" text-anchor="middle" class="title">LED Matrix Driver - IS31FL3731 + TCA9548A I2C Multiplexer</text>
    <text x="500" y="50" text-anchor="middle" class="subtitle">9×9 LED matrices (81 LEDs) per chessboard quadrant • Individual addressing via I2C mux</text>

    <!-- Raspberry Pi 5 (Master Controller) -->
    <rect x="50" y="100" width="140" height="180" class="ic-body"/>
    <text x="120" y="125" text-anchor="middle" class="ic-label">Raspberry Pi 5</text>
    <text x="120" y="142" text-anchor="middle" class="label-small">(Main Controller)</text>

    <!-- Pi I2C pins -->
    <circle cx="190" cy="170" r="3" class="node-i2c"/>
    <text x="200" y="172" class="pin-label">SDA (GPIO2)</text>
    <circle cx="190" cy="195" r="3" class="node-i2c"/>
    <text x="200" y="197" class="pin-label">SCL (GPIO3)</text>

    <!-- Pi Power -->
    <circle cx="190" cy="230" r="3" class="node"/>
    <text x="200" y="232" class="label-small">5V</text>
    <circle cx="190" cy="255" r="3" class="node"/>
    <text x="200" y="257" class="label-small">GND</text>

    <!-- I2C Bus Lines (SDA/SCL) -->
    <line x1="190" y1="170" x2="280" y2="170" class="wire-i2c" marker-end="url(#arrowhead)"/>
    <line x1="190" y1="195" x2="280" y2="195" class="wire-i2c" marker-end="url(#arrowhead)"/>
    <text x="220" y="165" class="label-small" style="fill: var(--accent);">I2C Bus</text>

    <!-- TCA9548A I2C Multiplexer -->
    <rect x="280" y="120" width="160" height="220" class="ic-body"/>
    <text x="360" y="145" text-anchor="middle" class="ic-label">TCA9548A</text>
    <text x="360" y="162" text-anchor="middle" class="label-small">8-Channel I2C Multiplexer</text>
    <text x="360" y="178" text-anchor="middle" class="label-small">Address: 0x70</text>

    <!-- TCA9548A input pins -->
    <circle cx="280" cy="170" r="3" class="node-i2c"/>
    <text x="270" y="172" text-anchor="end" class="pin-label">SDA</text>
    <circle cx="280" cy="195" r="3" class="node-i2c"/>
    <text x="270" y="197" text-anchor="end" class="pin-label">SCL</text>

    <!-- TCA9548A output channels (8 channels) -->
    <g id="mux-channels">
        <circle cx="440" cy="150" r="3" class="node-i2c"/>
        <text x="450" y="152" class="label-small">CH0 (0x74)</text>

        <circle cx="440" cy="175" r="3" class="node-i2c"/>
        <text x="450" y="177" class="label-small">CH1 (0x74)</text>

        <circle cx="440" cy="200" r="3" class="node-i2c"/>
        <text x="450" y="202" class="label-small">CH2 (0x74)</text>

        <circle cx="440" cy="225" r="3" class="node-i2c"/>
        <text x="450" y="227" class="label-small">CH3 (0x74)</text>

        <circle cx="440" cy="250" r="3" class="node-i2c"/>
        <text x="450" y="252" class="label-small">CH4 (0x74)</text>

        <circle cx="440" cy="275" r="3" class="node-i2c"/>
        <text x="450" y="277" class="label-small">CH5 (0x74)</text>

        <circle cx="440" cy="300" r="3" class="node-i2c"/>
        <text x="450" y="302" class="label-small">CH6 (0x74)</text>

        <circle cx="440" cy="325" r="3" class="node-i2c"/>
        <text x="450" y="327" class="label-small">CH7 (0x74)</text>
    </g>

    <!-- IS31FL3731 LED Driver #0 (example) -->
    <rect x="560" y="130" width="180" height="160" class="ic-body"/>
    <text x="650" y="155" text-anchor="middle" class="ic-label">IS31FL3731 #0</text>
    <text x="650" y="172" text-anchor="middle" class="label-small">LED Matrix Driver</text>
    <text x="650" y="188" text-anchor="middle" class="label-small">I2C Address: 0x74</text>

    <!-- IS31FL3731 pins -->
    <circle cx="560" cy="210" r="3" class="node-i2c"/>
    <text x="550" y="212" text-anchor="end" class="pin-label">SDA</text>
    <circle cx="560" cy="235" r="3" class="node-i2c"/>
    <text x="550" y="237" text-anchor="end" class="pin-label">SCL</text>
    <circle cx="560" cy="260" r="3" class="node"/>
    <text x="550" y="262" text-anchor="end" class="label-small">VCC</text>
    <circle cx="560" cy="275" r="3" class="node"/>
    <text x="550" y="277" text-anchor="end" class="label-small">GND</text>

    <!-- Connection from MUX CH0 to IS31FL3731 #0 -->
    <line x1="440" y1="150" x2="520" y2="150" class="wire-i2c"/>
    <line x1="520" y1="150" x2="520" y2="210" class="wire-i2c"/>
    <line x1="520" y1="210" x2="560" y2="210" class="wire-i2c"/>
    <line x1="520" y1="210" x2="520" y2="235" class="wire-i2c"/>
    <line x1="520" y1="235" x2="560" y2="235" class="wire-i2c"/>

    <!-- LED Matrix 9x9 (simplified representation) -->
    <rect x="770" y="140" width="180" height="140" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="860" y="165" text-anchor="middle" class="label">9×9 LED Matrix</text>
    <text x="860" y="182" text-anchor="middle" class="label-small">(81 LEDs total)</text>

    <!-- LED grid representation (3x3 sample) -->
    <g id="led-grid-sample">
        <use href="#led" transform="translate(800, 210)"/>
        <use href="#led" transform="translate(830, 210)"/>
        <use href="#led" transform="translate(860, 210)"/>

        <use href="#led" transform="translate(800, 235)"/>
        <use href="#led" transform="translate(830, 235)"/>
        <use href="#led" transform="translate(860, 235)"/>

        <use href="#led" transform="translate(800, 260)"/>
        <use href="#led" transform="translate(830, 260)"/>
        <use href="#led" transform="translate(860, 260)"/>

        <text x="920" y="238" class="label-small">... (9×9 grid)</text>
    </g>

    <!-- Connection from IS31FL3731 to LED matrix -->
    <line x1="740" y1="210" x2="770" y2="210" class="wire-data" marker-end="url(#arrowhead)"/>
    <text x="745" y="205" class="label-small" style="fill: var(--accent3);">C0-C8</text>
    <line x1="740" y1="235" x2="770" y2="235" class="wire-data" marker-end="url(#arrowhead)"/>
    <text x="745" y="230" class="label-small" style="fill: var(--accent3);">CA1-CA9</text>

    <!-- IS31FL3731 LED Driver #1 (condensed) -->
    <rect x="560" y="320" width="180" height="80" class="ic-body"/>
    <text x="650" y="345" text-anchor="middle" class="ic-label">IS31FL3731 #1</text>
    <text x="650" y="362" text-anchor="middle" class="label-small">I2C: 0x74 (via CH1)</text>
    <text x="650" y="378" text-anchor="middle" class="label-small">→ LED Matrix 9×9</text>

    <!-- Connection from MUX CH1 to IS31FL3731 #1 -->
    <line x1="440" y1="175" x2="500" y2="175" class="wire-i2c"/>
    <line x1="500" y1="175" x2="500" y2="350" class="wire-i2c"/>
    <line x1="500" y1="350" x2="560" y2="350" class="wire-i2c"/>

    <!-- Ellipsis for remaining drivers -->
    <text x="650" y="440" text-anchor="middle" class="label" style="font-size: 24px;">...</text>
    <text x="650" y="465" text-anchor="middle" class="label-small">IS31FL3731 #2-#7</text>
    <text x="650" y="482" text-anchor="middle" class="label-small">(8 total drivers for 8×8 board coverage)</text>

    <!-- IS31FL3731 LED Driver #7 (last one, condensed) -->
    <rect x="560" y="500" width="180" height="80" class="ic-body"/>
    <text x="650" y="525" text-anchor="middle" class="ic-label">IS31FL3731 #7</text>
    <text x="650" y="542" text-anchor="middle" class="label-small">I2C: 0x74 (via CH7)</text>
    <text x="650" y="558" text-anchor="middle" class="label-small">→ LED Matrix 9×9</text>

    <!-- Connection from MUX CH7 to IS31FL3731 #7 -->
    <line x1="440" y1="325" x2="490" y2="325" class="wire-i2c"/>
    <line x1="490" y1="325" x2="490" y2="530" class="wire-i2c"/>
    <line x1="490" y1="530" x2="560" y2="530" class="wire-i2c"/>

    <!-- Power distribution indicators -->
    <line x1="190" y1="230" x2="360" y2="230" class="wire-power"/>
    <line x1="360" y1="230" x2="360" y2="100" class="wire-power"/>
    <line x1="360" y1="100" x2="650" y2="100" class="wire-power"/>
    <text x="500" y="95" class="label-small" style="fill: var(--accent2);">5V Power Rail</text>
    <circle cx="650" cy="100" r="3" style="fill: var(--accent2);"/>
    <line x1="650" y1="100" x2="650" y2="260" class="wire-power"/>

    <!-- Annotation Box -->
    <rect x="50" y="620" width="900" height="160" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>

    <!-- Notes -->
    <text x="70" y="645" class="label" style="font-weight: 700;">System Architecture:</text>
    <text x="70" y="665" class="label-small">• TCA9548A allows 8× IS31FL3731 drivers to share the same I2C address (0x74) by channel-switching</text>
    <text x="70" y="682" class="label-small">• Each IS31FL3731 drives one 9×9 LED matrix (81 LEDs) using Charlieplexing</text>
    <text x="70" y="699" class="label-small">• Total: 8 matrices covering the 8×8 chessboard with overlap for inter-square lighting</text>
    <text x="70" y="716" class="label-small">• Raspberry Pi 5 controls all via standard Linux I2C driver (/dev/i2c-1)</text>

    <text x="550" y="645" class="label" style="font-weight: 700;">Pull-up Resistors:</text>
    <text x="550" y="665" class="label-small">• 4.7kΩ on SDA and SCL (main bus)</text>
    <text x="550" y="682" class="label-small">• Already present on Raspberry Pi GPIO header</text>

    <text x="550" y="710" class="label" style="font-weight: 700;">Power Budget:</text>
    <text x="550" y="730" class="label-small">• Each LED: ~20mA @ 5V (max brightness)</text>
    <text x="550" y="747" class="label-small">• 8 matrices × 81 LEDs = 648 LEDs total</text>
    <text x="550" y="764" class="label-small">• Max current (all on): ~13A @ 5V (regulated, duty-cycled)</text>
</svg>
