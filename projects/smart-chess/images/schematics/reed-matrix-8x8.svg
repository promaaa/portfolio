<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="8x8 Reed Sensor Matrix Schematic with Anti-Ghosting Diodes">
    <defs>
        <style>
            :root {
                --bg: #f7f7fb;
                --ink: #0a0a0e;
                --muted: #5e5e69;
                --line: rgba(0, 0, 0, 0.08);
                --accent: #5b5bd6;
                --surface: rgba(255, 255, 255, 0.7);
            }
            [data-theme="dark"] {
                --bg: #0b0e16;
                --ink: #f7f7fb;
                --muted: #b5b7c8;
                --line: rgba(255, 255, 255, 0.1);
                --accent: #8bbcff;
                --surface: rgba(255, 255, 255, 0.06);
            }
            .wire {
                stroke: var(--ink);
                stroke-width: 2;
                fill: none;
            }
            .wire-thick {
                stroke: var(--accent);
                stroke-width: 2.5;
                fill: none;
            }
            .component {
                fill: var(--surface);
                stroke: var(--ink);
                stroke-width: 1.5;
            }
            .reed-switch {
                fill: none;
                stroke: var(--ink);
                stroke-width: 2;
            }
            .diode {
                fill: var(--ink);
            }
            .label {
                font-family: 'Inter', sans-serif;
                font-size: 11px;
                fill: var(--ink);
                font-weight: 500;
            }
            .label-small {
                font-family: 'Inter', sans-serif;
                font-size: 9px;
                fill: var(--muted);
                font-weight: 400;
            }
            .title {
                font-family: 'Inter', sans-serif;
                font-size: 16px;
                fill: var(--ink);
                font-weight: 700;
            }
            .subtitle {
                font-family: 'Inter', sans-serif;
                font-size: 12px;
                fill: var(--muted);
                font-weight: 500;
            }
            .pin-label {
                font-family: 'Inter', sans-serif;
                font-size: 10px;
                fill: var(--accent);
                font-weight: 600;
            }
            .node {
                fill: var(--ink);
            }
        </style>

        <!-- Reed Switch Symbol -->
        <g id="reed-switch-symbol">
            <line x1="-15" y1="0" x2="-5" y2="0" class="reed-switch"/>
            <line x1="-5" y1="-8" x2="-5" y2="8" class="reed-switch"/>
            <line x1="5" y1="-8" x2="5" y2="8" class="reed-switch"/>
            <line x1="5" y1="0" x2="15" y2="0" class="reed-switch"/>
        </g>

        <!-- Diode Symbol -->
        <g id="diode-symbol">
            <line x1="-12" y1="0" x2="0" y2="0" class="wire"/>
            <polygon points="0,-6 0,6 8,0" class="diode"/>
            <line x1="8" y1="-6" x2="8" y2="6" class="diode"/>
            <line x1="8" y1="0" x2="20" y2="0" class="wire"/>
        </g>
    </defs>

    <!-- Background -->
    <rect width="900" height="700" fill="var(--bg)"/>

    <!-- Title Block -->
    <text x="450" y="30" text-anchor="middle" class="title">8×8 Reed Sensor Matrix with Diode Anti-Ghosting</text>
    <text x="450" y="50" text-anchor="middle" class="subtitle">64 sensors multiplexed in keyboard-style matrix • Prevents false detections</text>

    <!-- Row Lines (8 rows) -->
    <g id="row-lines">
        <line x1="120" y1="100" x2="800" y2="100" class="wire-thick"/>
        <line x1="120" y1="160" x2="800" y2="160" class="wire-thick"/>
        <line x1="120" y1="220" x2="800" y2="220" class="wire-thick"/>
        <line x1="120" y1="280" x2="800" y2="280" class="wire-thick"/>
        <line x1="120" y1="340" x2="800" y2="340" class="wire-thick"/>
        <line x1="120" y1="400" x2="800" y2="400" class="wire-thick"/>
        <line x1="120" y1="460" x2="800" y2="460" class="wire-thick"/>
        <line x1="120" y1="520" x2="800" y2="520" class="wire-thick"/>
    </g>

    <!-- Column Lines (8 columns) -->
    <g id="column-lines">
        <line x1="200" y1="80" x2="200" y2="540" class="wire"/>
        <line x1="280" y1="80" x2="280" y2="540" class="wire"/>
        <line x1="360" y1="80" x2="360" y2="540" class="wire"/>
        <line x1="440" y1="80" x2="440" y2="540" class="wire"/>
        <line x1="520" y1="80" x2="520" y2="540" class="wire"/>
        <line x1="600" y1="80" x2="600" y2="540" class="wire"/>
        <line x1="680" y1="80" x2="680" y2="540" class="wire"/>
        <line x1="760" y1="80" x2="760" y2="540" class="wire"/>
    </g>

    <!-- Sample Sensors and Diodes (showing pattern for first 2 rows, first 4 columns) -->

    <!-- Row 0 sensors -->
    <g transform="translate(200, 100)">
        <use href="#reed-switch-symbol"/>
        <use href="#diode-symbol" transform="translate(15, 0)"/>
        <line x1="35" y1="0" x2="0" y2="-20" class="wire"/>
        <circle cx="0" cy="-20" r="2" class="node"/>
        <text x="-5" y="-25" text-anchor="end" class="label-small">A0</text>
    </g>
    <g transform="translate(280, 100)">
        <use href="#reed-switch-symbol"/>
        <use href="#diode-symbol" transform="translate(15, 0)"/>
        <line x1="35" y1="0" x2="0" y2="-20" class="wire"/>
        <circle cx="0" cy="-20" r="2" class="node"/>
        <text x="-5" y="-25" text-anchor="end" class="label-small">A1</text>
    </g>
    <g transform="translate(360, 100)">
        <use href="#reed-switch-symbol"/>
        <use href="#diode-symbol" transform="translate(15, 0)"/>
        <line x1="35" y1="0" x2="0" y2="-20" class="wire"/>
        <circle cx="0" cy="-20" r="2" class="node"/>
        <text x="-5" y="-25" text-anchor="end" class="label-small">A2</text>
    </g>
    <g transform="translate(440, 100)">
        <use href="#reed-switch-symbol"/>
        <use href="#diode-symbol" transform="translate(15, 0)"/>
        <line x1="35" y1="0" x2="0" y2="-20" class="wire"/>
        <circle cx="0" cy="-20" r="2" class="node"/>
        <text x="-5" y="-25" text-anchor="end" class="label-small">A3</text>
    </g>

    <!-- Row 1 sensors -->
    <g transform="translate(200, 160)">
        <use href="#reed-switch-symbol"/>
        <use href="#diode-symbol" transform="translate(15, 0)"/>
        <line x1="35" y1="0" x2="0" y2="-20" class="wire"/>
        <circle cx="0" cy="-20" r="2" class="node"/>
        <text x="-5" y="-25" text-anchor="end" class="label-small">B0</text>
    </g>
    <g transform="translate(280, 160)">
        <use href="#reed-switch-symbol"/>
        <use href="#diode-symbol" transform="translate(15, 0)"/>
        <line x1="35" y1="0" x2="0" y2="-20" class="wire"/>
        <circle cx="0" cy="-20" r="2" class="node"/>
        <text x="-5" y="-25" text-anchor="end" class="label-small">B1</text>
    </g>
    <g transform="translate(360, 160)">
        <use href="#reed-switch-symbol"/>
        <use href="#diode-symbol" transform="translate(15, 0)"/>
        <line x1="35" y1="0" x2="0" y2="-20" class="wire"/>
        <circle cx="0" cy="-20" r="2" class="node"/>
        <text x="-5" y="-25" text-anchor="end" class="label-small">B2</text>
    </g>
    <g transform="translate(440, 160)">
        <use href="#reed-switch-symbol"/>
        <use href="#diode-symbol" transform="translate(15, 0)"/>
        <line x1="35" y1="0" x2="0" y2="-20" class="wire"/>
        <circle cx="0" cy="-20" r="2" class="node"/>
        <text x="-5" y="-25" text-anchor="end" class="label-small">B3</text>
    </g>

    <!-- Ellipsis indicators for remaining sensors -->
    <text x="520" y="105" text-anchor="middle" class="label" style="font-size: 20px;">...</text>
    <text x="520" y="165" text-anchor="middle" class="label" style="font-size: 20px;">...</text>
    <text x="520" y="225" text-anchor="middle" class="label" style="font-size: 20px;">...</text>
    <text x="520" y="285" text-anchor="middle" class="label" style="font-size: 20px;">...</text>
    <text x="520" y="345" text-anchor="middle" class="label" style="font-size: 20px;">...</text>
    <text x="520" y="405" text-anchor="middle" class="label" style="font-size: 20px;">...</text>
    <text x="520" y="465" text-anchor="middle" class="label" style="font-size: 20px;">...</text>
    <text x="520" y="525" text-anchor="middle" class="label" style="font-size: 20px;">...</text>

    <!-- Row Labels (left side) -->
    <text x="80" y="105" text-anchor="end" class="pin-label">ROW0</text>
    <text x="80" y="165" text-anchor="end" class="pin-label">ROW1</text>
    <text x="80" y="225" text-anchor="end" class="pin-label">ROW2</text>
    <text x="80" y="285" text-anchor="end" class="pin-label">ROW3</text>
    <text x="80" y="345" text-anchor="end" class="pin-label">ROW4</text>
    <text x="80" y="405" text-anchor="end" class="pin-label">ROW5</text>
    <text x="80" y="465" text-anchor="end" class="pin-label">ROW6</text>
    <text x="80" y="525" text-anchor="end" class="pin-label">ROW7</text>

    <!-- Column Labels (top) -->
    <text x="200" y="70" text-anchor="middle" class="pin-label">COL0</text>
    <text x="280" y="70" text-anchor="middle" class="pin-label">COL1</text>
    <text x="360" y="70" text-anchor="middle" class="pin-label">COL2</text>
    <text x="440" y="70" text-anchor="middle" class="pin-label">COL3</text>
    <text x="520" y="70" text-anchor="middle" class="pin-label">COL4</text>
    <text x="600" y="70" text-anchor="middle" class="pin-label">COL5</text>
    <text x="680" y="70" text-anchor="middle" class="pin-label">COL6</text>
    <text x="760" y="70" text-anchor="middle" class="pin-label">COL7</text>

    <!-- Connection to microcontroller indicators -->
    <line x1="100" y1="100" x2="120" y2="100" class="wire-thick"/>
    <line x1="100" y1="160" x2="120" y2="160" class="wire-thick"/>
    <line x1="100" y1="220" x2="120" y2="220" class="wire-thick"/>
    <line x1="100" y1="280" x2="120" y2="280" class="wire-thick"/>
    <line x1="100" y1="340" x2="120" y2="340" class="wire-thick"/>
    <line x1="100" y1="400" x2="120" y2="400" class="wire-thick"/>
    <line x1="100" y1="460" x2="120" y2="460" class="wire-thick"/>
    <line x1="100" y1="520" x2="120" y2="520" class="wire-thick"/>

    <line x1="200" y1="60" x2="200" y2="80" class="wire"/>
    <line x1="280" y1="60" x2="280" y2="80" class="wire"/>
    <line x1="360" y1="60" x2="360" y2="80" class="wire"/>
    <line x1="440" y1="60" x2="440" y2="80" class="wire"/>
    <line x1="520" y1="60" x2="520" y2="80" class="wire"/>
    <line x1="600" y1="60" x2="600" y2="80" class="wire"/>
    <line x1="680" y1="60" x2="680" y2="80" class="wire"/>
    <line x1="760" y1="60" x2="760" y2="80" class="wire"/>

    <!-- Annotation Box -->
    <rect x="50" y="570" width="800" height="110" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>

    <!-- Legend and Notes -->
    <text x="70" y="595" class="label" style="font-weight: 700;">How it works:</text>
    <text x="70" y="615" class="label-small">• Each chess square has one reed switch (NO - normally open) + one 1N4148 diode</text>
    <text x="70" y="632" class="label-small">• Rows are driven HIGH one at a time by the microcontroller (8 GPIO pins)</text>
    <text x="70" y="649" class="label-small">• Columns are read as inputs with pull-down resistors (8 GPIO pins)</text>
    <text x="70" y="666" class="label-small">• Diodes prevent ghosting: current can only flow from ROW → REED → DIODE → COL (unidirectional)</text>

    <text x="480" y="595" class="label" style="font-weight: 700;">Anti-Ghosting:</text>
    <text x="480" y="615" class="label-small">Without diodes: pressing multiple pieces creates phantom readings</text>
    <text x="480" y="632" class="label-small">With diodes: only actual closed switches register</text>

    <text x="480" y="655" class="label" style="font-weight: 700;">Component Count:</text>
    <text x="480" y="672" class="label-small">64× Reed Switches (KSK-1A85) + 64× 1N4148 diodes = 16 GPIO pins total</text>
</svg>
