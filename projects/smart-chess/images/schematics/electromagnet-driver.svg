<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Electromagnet Driver Circuit - MOSFET with Flyback Protection">
    <defs>
        <style>
            :root {
                --bg: #f7f7fb;
                --ink: #0a0a0e;
                --muted: #5e5e69;
                --line: rgba(0, 0, 0, 0.08);
                --accent: #5b5bd6;
                --accent2: #ff6b6b;
                --accent3: #4ecdc4;
                --surface: rgba(255, 255, 255, 0.7);
            }
            [data-theme="dark"] {
                --bg: #0b0e16;
                --ink: #f7f7fb;
                --muted: #b5b7c8;
                --line: rgba(255, 255, 255, 0.1);
                --accent: #8bbcff;
                --accent2: #ff8787;
                --accent3: #6fded6;
                --surface: rgba(255, 255, 255, 0.06);
            }
            .wire {
                stroke: var(--ink);
                stroke-width: 2;
                fill: none;
            }
            .wire-power {
                stroke: var(--accent2);
                stroke-width: 2.5;
                fill: none;
            }
            .wire-gnd {
                stroke: var(--ink);
                stroke-width: 2.5;
                fill: none;
            }
            .wire-signal {
                stroke: var(--accent);
                stroke-width: 2;
                fill: none;
            }
            .component {
                fill: var(--surface);
                stroke: var(--ink);
                stroke-width: 2;
            }
            .resistor {
                fill: none;
                stroke: var(--ink);
                stroke-width: 2;
            }
            .mosfet {
                fill: none;
                stroke: var(--ink);
                stroke-width: 2;
            }
            .diode {
                fill: var(--ink);
            }
            .inductor {
                fill: none;
                stroke: var(--ink);
                stroke-width: 2.5;
            }
            .label {
                font-family: 'Inter', sans-serif;
                font-size: 11px;
                fill: var(--ink);
                font-weight: 500;
            }
            .label-small {
                font-family: 'Inter', sans-serif;
                font-size: 9px;
                fill: var(--muted);
                font-weight: 400;
            }
            .title {
                font-family: 'Inter', sans-serif;
                font-size: 18px;
                fill: var(--ink);
                font-weight: 700;
            }
            .subtitle {
                font-family: 'Inter', sans-serif;
                font-size: 13px;
                fill: var(--muted);
                font-weight: 500;
            }
            .value {
                font-family: 'Inter', sans-serif;
                font-size: 10px;
                fill: var(--accent);
                font-weight: 600;
            }
            .node {
                fill: var(--ink);
            }
            .gnd-symbol {
                stroke: var(--ink);
                stroke-width: 2;
                fill: none;
            }
            .annotation {
                fill: var(--surface);
                stroke: var(--accent3);
                stroke-width: 1.5;
                stroke-dasharray: 4,2;
            }
        </style>

        <!-- Ground symbol -->
        <g id="gnd">
            <line x1="0" y1="0" x2="0" y2="8" class="gnd-symbol"/>
            <line x1="-12" y1="8" x2="12" y2="8" class="gnd-symbol"/>
            <line x1="-8" y1="13" x2="8" y2="13" class="gnd-symbol"/>
            <line x1="-4" y1="18" x2="4" y2="18" class="gnd-symbol"/>
        </g>

        <!-- Resistor symbol -->
        <g id="resistor-h">
            <rect x="-20" y="-6" width="40" height="12" rx="2" class="resistor"/>
        </g>

        <!-- N-Channel MOSFET symbol -->
        <g id="nmos">
            <line x1="-5" y1="-25" x2="-5" y2="25" class="mosfet"/>
            <line x1="-5" y1="-15" x2="10" y2="-15" class="mosfet"/>
            <line x1="10" y1="-15" x2="10" y2="-25" class="mosfet"/>
            <line x1="-5" y1="0" x2="10" y2="0" class="mosfet"/>
            <line x1="-5" y1="15" x2="10" y2="15" class="mosfet"/>
            <line x1="10" y1="15" x2="10" y2="25" class="mosfet"/>
            <line x1="10" y1="-25" x2="10" y2="-35" class="mosfet"/>
            <line x1="10" y1="25" x2="10" y2="35" class="mosfet"/>
            <line x1="-15" y1="0" x2="-5" y2="0" class="mosfet"/>
            <polygon points="10,0 0,-6 0,6" class="diode"/>
        </g>

        <!-- Diode symbol (vertical) -->
        <g id="diode-v">
            <line x1="0" y1="-20" x2="0" y2="0" class="wire"/>
            <polygon points="-8,0 8,0 0,10" class="diode"/>
            <line x1="-8" y1="10" x2="8" y2="10" class="diode"/>
            <line x1="0" y1="10" x2="0" y2="30" class="wire"/>
        </g>

        <!-- Electromagnet/Solenoid symbol -->
        <g id="solenoid">
            <path d="M -10,-30 Q -10,-20 0,-20 Q 10,-20 10,-10 Q 10,0 0,0 Q -10,0 -10,10 Q -10,20 0,20 Q 10,20 10,30" class="inductor"/>
            <line x1="0" y1="-40" x2="0" y2="-30" class="inductor"/>
            <line x1="0" y1="30" x2="0" y2="40" class="inductor"/>
        </g>
    </defs>

    <!-- Background -->
    <rect width="800" height="600" fill="var(--bg)"/>

    <!-- Title Block -->
    <text x="400" y="30" text-anchor="middle" class="title">Electromagnet Driver Circuit</text>
    <text x="400" y="50" text-anchor="middle" class="subtitle">N-Channel MOSFET Low-Side Switch with Flyback Protection</text>

    <!-- Main Circuit -->

    <!-- Power Supply +12V -->
    <line x1="300" y1="100" x2="300" y2="120" class="wire-power"/>
    <circle cx="300" cy="100" r="4" style="fill: var(--accent2);"/>
    <text x="300" y="90" text-anchor="middle" class="value">+12V</text>

    <!-- Electromagnet/Solenoid -->
    <g transform="translate(300, 160)">
        <use href="#solenoid"/>
        <text x="30" y="-10" class="label">L1</text>
        <text x="30" y="5" class="label-small">Electromagnet</text>
        <text x="30" y="20" class="value">12V, 800mA</text>
        <text x="30" y="33" class="label-small">(Holding force: 2kg)</text>
    </g>

    <!-- Connection from +12V to electromagnet -->
    <line x1="300" y1="120" x2="300" y2="120" class="wire-power"/>

    <!-- Flyback Diode D1 (in parallel with electromagnet) -->
    <g transform="translate(380, 150)">
        <use href="#diode-v"/>
        <text x="20" y="0" class="label">D1</text>
        <text x="20" y="13" class="value">1N4007</text>
        <text x="20" y="26" class="label-small">Flyback</text>
    </g>
    <line x1="380" y1="130" x2="300" y2="130" class="wire"/>
    <line x1="380" y1="210" x2="300" y2="210" class="wire"/>
    <circle cx="300" cy="130" r="2.5" class="node"/>
    <circle cx="300" cy="210" r="2.5" class="node"/>

    <!-- MOSFET Q1 -->
    <g transform="translate(300, 250)">
        <use href="#nmos"/>
        <text x="30" y="-25" class="label">Q1</text>
        <text x="30" y="-12" class="value">IRLZ44N</text>
        <text x="30" y="1" class="label-small">N-CH MOSFET</text>
        <text x="30" y="14" class="label-small">V_DS: 55V</text>
        <text x="30" y="27" class="label-small">I_D: 47A</text>
        <text x="-35" y="5" class="label-small">G</text>
        <text x="25" y="-30" class="label-small">D</text>
        <text x="25" y="38" class="label-small">S</text>
    </g>

    <!-- Connection from electromagnet to MOSFET drain -->
    <line x1="300" y1="200" x2="300" y2="215" class="wire"/>

    <!-- Gate resistor R2 -->
    <g transform="translate(220, 250)">
        <use href="#resistor-h"/>
        <text x="0" y="-12" text-anchor="middle" class="label">R2</text>
        <text x="0" y="22" text-anchor="middle" class="value">10kΩ</text>
        <text x="0" y="34" text-anchor="middle" class="label-small">Pull-down</text>
    </g>
    <line x1="240" y1="250" x2="285" y2="250" class="wire"/>

    <!-- Gate pull-down to GND -->
    <line x1="200" y1="250" x2="180" y2="250" class="wire"/>
    <line x1="180" y1="250" x2="180" y2="320" class="wire"/>
    <g transform="translate(180, 320)">
        <use href="#gnd"/>
    </g>

    <!-- Current limiting resistor R1 on gate signal -->
    <g transform="translate(120, 250)">
        <use href="#resistor-h"/>
        <text x="0" y="-12" text-anchor="middle" class="label">R1</text>
        <text x="0" y="22" text-anchor="middle" class="value">220Ω</text>
        <text x="0" y="34" text-anchor="middle" class="label-small">Gate limit</text>
    </g>
    <line x1="140" y1="250" x2="200" y2="250" class="wire-signal"/>
    <circle cx="200" cy="250" r="2.5" class="node"/>

    <!-- Control signal from microcontroller -->
    <line x1="50" y1="250" x2="100" y2="250" class="wire-signal"/>
    <circle cx="50" cy="250" r="4" style="fill: var(--accent);"/>
    <text x="55" y="245" class="label">PWM_CTRL</text>
    <text x="55" y="258" class="label-small">From ESP32</text>
    <text x="55" y="271" class="value">GPIO 25</text>
    <text x="55" y="284" class="label-small">0V/3.3V</text>

    <!-- MOSFET source to GND -->
    <line x1="310" y1="285" x2="310" y2="320" class="wire-gnd"/>
    <g transform="translate(310, 320)">
        <use href="#gnd"/>
    </g>

    <!-- Annotation box for flyback protection -->
    <rect x="430" y="140" width="320" height="110" rx="6" class="annotation"/>
    <text x="445" y="162" class="label" style="font-weight: 700;">⚡ Flyback Protection:</text>
    <text x="445" y="180" class="label-small">When MOSFET turns OFF, electromagnet's</text>
    <text x="445" y="195" class="label-small">collapsing magnetic field induces high</text>
    <text x="445" y="210" class="label-small">reverse voltage (V = -L × di/dt).</text>
    <text x="445" y="225" class="label-small">D1 clamps this spike to +12V, protecting Q1.</text>
    <text x="445" y="240" class="label-small">Without D1: MOSFET destruction!</text>

    <!-- Annotation box for operation -->
    <rect x="430" y="270" width="320" height="100" rx="6" class="annotation"/>
    <text x="445" y="292" class="label" style="font-weight: 700;">🔧 Operation:</text>
    <text x="445" y="310" class="label-small">• PWM HIGH (3.3V) → Q1 ON → Magnet energized</text>
    <text x="445" y="325" class="label-small">• PWM LOW (0V) → Q1 OFF → Magnet de-energized</text>
    <text x="445" y="340" class="label-small">• R2 ensures gate stays LOW when idle</text>
    <text x="445" y="355" class="label-small">• R1 limits inrush current to gate capacitance</text>

    <!-- Notes section -->
    <rect x="50" y="400" width="700" height="170" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>

    <text x="70" y="425" class="label" style="font-weight: 700;">Design Considerations:</text>
    <text x="70" y="445" class="label-small">• IRLZ44N chosen for logic-level gate drive (V_GS(th) = 1-2V, fully on at 3.3V from ESP32)</text>
    <text x="70" y="462" class="label-small">• 1N4007 rated for 1A continuous (electromagnet draws 800mA typical), 1000V PIV (overkill but robust)</text>
    <text x="70" y="479" class="label-small">• R1 (220Ω) limits gate charge current to ~15mA (safe for ESP32 GPIO, typ. 12mA limit)</text>
    <text x="70" y="496" class="label-small">• R2 (10kΩ) prevents floating gate when ESP32 is in high-Z state (boot, reset)</text>
    <text x="70" y="513" class="label-small">• Low-side switching topology: simple, efficient, no level-shifter needed</text>

    <text x="70" y="538" class="label" style="font-weight: 700;">Measured Performance:</text>
    <text x="70" y="558" class="label-small">• Turn-on time: ~2ms (inductance limits slew rate) • Holding current: 800mA @ 12V • Power dissipation: 9.6W (magnet), ~80mW (MOSFET R_DS(on) ≈ 0.1Ω)</text>
</svg>
