research-portfolio/projects/smart-chess/images/schematics/electromagnet-driver.svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <rect x="0" y="0" width="600" height="350" fill="#fff"/>
  <text x="300" y="30" text-anchor="middle" font-size="22" font-family="Arial" font-weight="bold">Electromagnet Driver Circuit</text>
  <!-- Power -->
  <line x1="100" y1="80" x2="100" y2="120" stroke="#e74c3c" stroke-width="3"/>
  <text x="100" y="70" text-anchor="middle" font-size="14" fill="#e74c3c">+12V</text>
  <!-- Electromagnet (solenoid) -->
  <rect x="80" y="120" width="40" height="40" fill="none" stroke="#222" stroke-width="2"/>
  <text x="100" y="150" text-anchor="middle" font-size="12">Electromagnet</text>
  <!-- Flyback diode -->
  <line x1="120" y1="140" x2="180" y2="140" stroke="#222" stroke-width="2"/>
  <polygon points="150,135 160,140 150,145" fill="#222"/>
  <rect x="180" y="130" width="40" height="20" fill="none" stroke="#222" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" font-size="12">D1</text>
  <text x="200" y="160" text-anchor="middle" font-size="10" fill="#388e3c">Flyback</text>
  <!-- MOSFET -->
  <line x1="100" y1="160" x2="100" y2="220" stroke="#222" stroke-width="2"/>
  <rect x="90" y="220" width="20" height="40" fill="none" stroke="#222" stroke-width="2"/>
  <text x="100" y="245" text-anchor="middle" font-size="12">Q1</text>
  <text x="100" y="260" text-anchor="middle" font-size="10" fill="#1976d2">N-MOSFET</text>
  <!-- Ground -->
  <line x1="100" y1="260" x2="100" y2="300" stroke="#222" stroke-width="3"/>
  <circle cx="100" cy="305" r="5" fill="#222"/>
  <text x="100" y="325" text-anchor="middle" font-size="12" fill="#222">GND</text>
  <!-- Control signal -->
  <line x1="40" y1="240" x2="90" y2="240" stroke="#1976d2" stroke-width="2"/>
  <circle cx="40" cy="240" r="5" fill="#1976d2"/>
  <text x="40" y="230" text-anchor="middle" font-size="12" fill="#1976d2">PWM</text>
</svg>
