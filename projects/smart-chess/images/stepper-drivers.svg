<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="XY Gantry Stepper Motor Drivers - A4988/DRV8825">
    <defs>
        <style>
            :root {
                --bg: #f7f7fb;
                --ink: #0a0a0e;
                --muted: #5e5e69;
                --line: rgba(0, 0, 0, 0.08);
                --accent: #5b5bd6;
                --accent2: #ff6b6b;
                --accent3: #4ecdc4;
                --accent4: #f9ca24;
                --surface: rgba(255, 255, 255, 0.7);
            }
            [data-theme="dark"] {
                --bg: #0b0e16;
                --ink: #f7f7fb;
                --muted: #b5b7c8;
                --line: rgba(255, 255, 255, 0.1);
                --accent: #8bbcff;
                --accent2: #ff8787;
                --accent3: #6fded6;
                --accent4: #ffd93d;
                --surface: rgba(255, 255, 255, 0.06);
            }
            .wire {
                stroke: var(--ink);
                stroke-width: 2;
                fill: none;
            }
            .wire-power {
                stroke: var(--accent2);
                stroke-width: 2.5;
                fill: none;
            }
            .wire-signal {
                stroke: var(--accent);
                stroke-width: 2;
                fill: none;
            }
            .wire-motor {
                stroke: var(--accent3);
                stroke-width: 2.5;
                fill: none;
            }
            .component {
                fill: var(--surface);
                stroke: var(--ink);
                stroke-width: 2;
            }
            .ic-body {
                fill: var(--surface);
                stroke: var(--ink);
                stroke-width: 2;
                rx: 4;
            }
            .capacitor {
                fill: none;
                stroke: var(--ink);
                stroke-width: 2;
            }
            .label {
                font-family: 'Inter', sans-serif;
                font-size: 11px;
                fill: var(--ink);
                font-weight: 500;
            }
            .label-small {
                font-family: 'Inter', sans-serif;
                font-size: 9px;
                fill: var(--muted);
                font-weight: 400;
            }
            .title {
                font-family: 'Inter', sans-serif;
                font-size: 18px;
                fill: var(--ink);
                font-weight: 700;
            }
            .subtitle {
                font-family: 'Inter', sans-serif;
                font-size: 13px;
                fill: var(--muted);
                font-weight: 500;
            }
            .value {
                font-family: 'Inter', sans-serif;
                font-size: 10px;
                fill: var(--accent);
                font-weight: 600;
            }
            .pin-label {
                font-family: 'Inter', sans-serif;
                font-size: 9px;
                fill: var(--ink);
                font-weight: 500;
            }
            .node {
                fill: var(--ink);
            }
            .gnd-symbol {
                stroke: var(--ink);
                stroke-width: 2;
                fill: none;
            }
            .motor-coil {
                fill: none;
                stroke: var(--accent3);
                stroke-width: 2.5;
            }
        </style>

        <!-- Ground symbol -->
        <g id="gnd">
            <line x1="0" y1="0" x2="0" y2="8" class="gnd-symbol"/>
            <line x1="-12" y1="8" x2="12" y2="8" class="gnd-symbol"/>
            <line x1="-8" y1="13" x2="8" y2="13" class="gnd-symbol"/>
            <line x1="-4" y1="18" x2="4" y2="18" class="gnd-symbol"/>
        </g>

        <!-- Capacitor symbol -->
        <g id="cap-v">
            <line x1="0" y1="-15" x2="0" y2="-5" class="capacitor"/>
            <line x1="-8" y1="-5" x2="8" y2="-5" class="capacitor"/>
            <line x1="-8" y1="5" x2="8" y2="5" class="capacitor"/>
            <line x1="0" y1="5" x2="0" y2="15" class="capacitor"/>
        </g>

        <!-- Stepper motor symbol -->
        <g id="stepper-motor">
            <circle cx="0" cy="0" r="40" class="component"/>
            <text x="0" y="-48" text-anchor="middle" class="label">NEMA 17</text>
            <text x="0" y="5" text-anchor="middle" class="label" style="font-size: 14px; font-weight: 700;">M</text>
            <circle cx="0" cy="0" r="15" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
            <!-- Coil terminals -->
            <circle cx="-50" cy="-20" r="3" class="node"/>
            <text x="-60" y="-17" text-anchor="end" class="pin-label">A1</text>
            <circle cx="-50" cy="20" r="3" class="node"/>
            <text x="-60" y="23" text-anchor="end" class="pin-label">A2</text>
            <circle cx="50" cy="-20" r="3" class="node"/>
            <text x="60" y="-17" class="pin-label">B1</text>
            <circle cx="50" cy="20" r="3" class="node"/>
            <text x="60" y="23" class="pin-label">B2</text>
            <line x1="-40" y1="-20" x2="-50" y2="-20" class="wire-motor"/>
            <line x1="-40" y1="20" x2="-50" y2="20" class="wire-motor"/>
            <line x1="40" y1="-20" x2="50" y2="-20" class="wire-motor"/>
            <line x1="40" y1="20" x2="50" y2="20" class="wire-motor"/>
        </g>
    </defs>

    <!-- Background -->
    <rect width="1000" height="700" fill="var(--bg)"/>

    <!-- Title Block -->
    <text x="500" y="30" text-anchor="middle" class="title">XY Gantry Stepper Motor Drivers</text>
    <text x="500" y="50" text-anchor="middle" class="subtitle">Dual A4988/DRV8825 drivers for independent X and Y axis control</text>

    <!-- ESP32 Controller (left side) -->
    <rect x="50" y="150" width="160" height="300" class="ic-body"/>
    <text x="130" y="175" text-anchor="middle" class="label" style="font-size: 13px; font-weight: 700;">ESP32</text>
    <text x="130" y="192" text-anchor="middle" class="label-small">Motor Controller</text>

    <!-- ESP32 output pins for X-axis -->
    <text x="65" y="225" class="label-small" style="font-weight: 600;">X-Axis Signals:</text>
    <circle cx="210" cy="240" r="3" class="node"/>
    <text x="220" y="242" class="pin-label">GPIO 26 - STEP_X</text>
    <circle cx="210" cy="260" r="3" class="node"/>
    <text x="220" y="262" class="pin-label">GPIO 27 - DIR_X</text>
    <circle cx="210" cy="280" r="3" class="node"/>
    <text x="220" y="282" class="pin-label">GPIO 14 - EN_X</text>

    <!-- ESP32 output pins for Y-axis -->
    <text x="65" y="315" class="label-small" style="font-weight: 600;">Y-Axis Signals:</text>
    <circle cx="210" cy="330" r="3" class="node"/>
    <text x="220" y="332" class="pin-label">GPIO 32 - STEP_Y</text>
    <circle cx="210" cy="350" r="3" class="node"/>
    <text x="220" y="352" class="pin-label">GPIO 33 - DIR_Y</text>
    <circle cx="210" cy="370" r="3" class="node"/>
    <text x="220" y="372" class="pin-label">GPIO 25 - EN_Y</text>

    <!-- Microstepping config -->
    <text x="65" y="405" class="label-small" style="font-weight: 600;">Microstepping:</text>
    <circle cx="210" cy="420" r="3" class="node"/>
    <text x="220" y="422" class="pin-label">GPIO 12 - MS1</text>
    <circle cx="210" cy="435" r="3" class="node"/>
    <text x="220" y="437" class="pin-label">GPIO 13 - MS2</text>

    <!-- A4988 Driver #1 (X-Axis) -->
    <rect x="380" y="130" width="140" height="200" class="ic-body"/>
    <text x="450" y="155" text-anchor="middle" class="label" style="font-size: 12px; font-weight: 700;">A4988 / DRV8825</text>
    <text x="450" y="170" text-anchor="middle" class="label-small">X-Axis Driver</text>

    <!-- Driver inputs (left side) -->
    <circle cx="380" cy="195" r="3" class="node"/>
    <text x="370" y="197" text-anchor="end" class="pin-label">STEP</text>
    <circle cx="380" cy="215" r="3" class="node"/>
    <text x="370" y="217" text-anchor="end" class="pin-label">DIR</text>
    <circle cx="380" cy="235" r="3" class="node"/>
    <text x="370" y="237" text-anchor="end" class="pin-label">EN</text>
    <circle cx="380" cy="255" r="3" class="node"/>
    <text x="370" y="257" text-anchor="end" class="pin-label">MS1</text>
    <circle cx="380" cy="275" r="3" class="node"/>
    <text x="370" y="277" text-anchor="end" class="pin-label">MS2</text>
    <circle cx="380" cy="295" r="3" class="node"/>
    <text x="370" y="297" text-anchor="end" class="pin-label">MS3</text>
    <text x="390" y="315" class="label-small">1/16 step mode</text>

    <!-- Driver outputs (right side) -->
    <circle cx="520" cy="200" r="3" style="fill: var(--accent3);"/>
    <text x="530" y="202" class="pin-label">1A</text>
    <circle cx="520" cy="220" r="3" style="fill: var(--accent3);"/>
    <text x="530" y="222" class="pin-label">1B</text>
    <circle cx="520" cy="250" r="3" style="fill: var(--accent3);"/>
    <text x="530" y="252" class="pin-label">2A</text>
    <circle cx="520" cy="270" r="3" style="fill: var(--accent3);"/>
    <text x="530" y="272" class="pin-label">2B</text>

    <!-- Power pins -->
    <text x="390" y="190" class="label-small" style="fill: var(--accent2);">VMOT: 12V</text>
    <text x="390" y="302" class="label-small">VDD: 3.3V</text>

    <!-- Connections from ESP32 to Driver X -->
    <line x1="210" y1="240" x2="380" y2="195" class="wire-signal"/>
    <line x1="210" y1="260" x2="380" y2="215" class="wire-signal"/>
    <line x1="210" y1="280" x2="380" y2="235" class="wire-signal"/>
    <line x1="210" y1="420" x2="340" y2="420" class="wire-signal"/>
    <line x1="340" y1="420" x2="340" y2="255" class="wire-signal"/>
    <line x1="340" y1="255" x2="380" y2="255" class="wire-signal"/>
    <line x1="210" y1="435" x2="350" y2="435" class="wire-signal"/>
    <line x1="350" y1="435" x2="350" y2="275" class="wire-signal"/>
    <line x1="350" y1="275" x2="380" y2="275" class="wire-signal"/>

    <!-- MS3 to GND for 1/16 step -->
    <line x1="360" y1="295" x2="360" y2="310" class="wire"/>
    <g transform="translate(360, 310)">
        <use href="#gnd"/>
        <text x="15" y="5" class="label-small">MS3=GND</text>
    </g>

    <!-- A4988 Driver #2 (Y-Axis) -->
    <rect x="380" y="380" width="140" height="200" class="ic-body"/>
    <text x="450" y="405" text-anchor="middle" class="label" style="font-size: 12px; font-weight: 700;">A4988 / DRV8825</text>
    <text x="450" y="420" text-anchor="middle" class="label-small">Y-Axis Driver</text>

    <!-- Driver inputs (left side) -->
    <circle cx="380" cy="445" r="3" class="node"/>
    <text x="370" y="447" text-anchor="end" class="pin-label">STEP</text>
    <circle cx="380" cy="465" r="3" class="node"/>
    <text x="370" y="467" text-anchor="end" class="pin-label">DIR</text>
    <circle cx="380" cy="485" r="3" class="node"/>
    <text x="370" y="487" text-anchor="end" class="pin-label">EN</text>
    <circle cx="380" cy="505" r="3" class="node"/>
    <text x="370" y="507" text-anchor="end" class="pin-label">MS1</text>
    <circle cx="380" cy="525" r="3" class="node"/>
    <text x="370" y="527" text-anchor="end" class="pin-label">MS2</text>
    <circle cx="380" cy="545" r="3" class="node"/>
    <text x="370" y="547" text-anchor="end" class="pin-label">MS3</text>
    <text x="390" y="565" class="label-small">1/16 step mode</text>

    <!-- Driver outputs (right side) -->
    <circle cx="520" cy="450" r="3" style="fill: var(--accent3);"/>
    <text x="530" y="452" class="pin-label">1A</text>
    <circle cx="520" cy="470" r="3" style="fill: var(--accent3);"/>
    <text x="530" y="472" class="pin-label">1B</text>
    <circle cx="520" cy="500" r="3" style="fill: var(--accent3);"/>
    <text x="530" y="502" class="pin-label">2A</text>
    <circle cx="520" cy="520" r="3" style="fill: var(--accent3);"/>
    <text x="530" y="522" class="pin-label">2B</text>

    <!-- Power pins -->
    <text x="390" y="440" class="label-small" style="fill: var(--accent2);">VMOT: 12V</text>
    <text x="390" y="552" class="label-small">VDD: 3.3V</text>

    <!-- Connections from ESP32 to Driver Y -->
    <line x1="210" y1="330" x2="380" y2="445" class="wire-signal"/>
    <line x1="210" y1="350" x2="380" y2="465" class="wire-signal"/>
    <line x1="210" y1="370" x2="380" y2="485" class="wire-signal"/>
    <line x1="340" y1="420" x2="340" y2="505" class="wire-signal"/>
    <line x1="340" y1="505" x2="380" y2="505" class="wire-signal"/>
    <line x1="350" y1="435" x2="350" y2="525" class="wire-signal"/>
    <line x1="350" y1="525" x2="380" y2="525" class="wire-signal"/>

    <!-- MS3 to GND -->
    <line x1="360" y1="545" x2="360" y2="560" class="wire"/>
    <g transform="translate(360, 560)">
        <use href="#gnd"/>
    </g>

    <!-- NEMA 17 Motor X-Axis -->
    <g transform="translate(680, 240)">
        <use href="#stepper-motor"/>
        <text x="0" y="60" text-anchor="middle" class="label-small">X-Axis Motor</text>
        <text x="0" y="73" text-anchor="middle" class="value">1.2A/phase</text>
    </g>

    <!-- Connections from Driver X to Motor X -->
    <line x1="520" y1="200" x2="630" y2="200" class="wire-motor"/>
    <line x1="630" y1="200" x2="630" y2="220" class="wire-motor"/>
    <line x1="520" y1="220" x2="620" y2="220" class="wire-motor"/>
    <line x1="620" y1="220" x2="620" y2="240" class="wire-motor"/>
    <line x1="520" y1="250" x2="730" y2="250" class="wire-motor"/>
    <line x1="730" y1="250" x2="730" y2="220" class="wire-motor"/>
    <line x1="520" y1="270" x2="740" y2="270" class="wire-motor"/>
    <line x1="740" y1="270" x2="740" y2="260" class="wire-motor"/>

    <!-- NEMA 17 Motor Y-Axis -->
    <g transform="translate(680, 490)">
        <use href="#stepper-motor"/>
        <text x="0" y="60" text-anchor="middle" class="label-small">Y-Axis Motor</text>
        <text x="0" y="73" text-anchor="middle" class="value">1.2A/phase</text>
    </g>

    <!-- Connections from Driver Y to Motor Y -->
    <line x1="520" y1="450" x2="630" y2="450" class="wire-motor"/>
    <line x1="630" y1="450" x2="630" y2="470" class="wire-motor"/>
    <line x1="520" y1="470" x2="620" y2="470" class="wire-motor"/>
    <line x1="620" y1="470" x2="620" y2="490" class="wire-motor"/>
    <line x1="520" y1="500" x2="730" y2="500" class="wire-motor"/>
    <line x1="730" y1="500" x2="730" y2="470" class="wire-motor"/>
    <line x1="520" y1="520" x2="740" y2="520" class="wire-motor"/>
    <line x1="740" y1="520" x2="740" y2="510" class="wire-motor"/>

    <!-- Power supply section -->
    <rect x="780" y="130" width="180" height="150" rx="6" fill="var(--surface)" stroke="var(--accent2)" stroke-width="2"/>
    <text x="870" y="155" text-anchor="middle" class="label" style="font-weight: 700;">Power Supply</text>

    <circle cx="810" cy="180" r="4" style="fill: var(--accent2);"/>
    <text x="820" y="183" class="label">+12V (VMOT)</text>
    <text x="820" y="198" class="label-small">Motor power rail</text>
    <text x="820" y="212" class="value">→ Both drivers</text>

    <circle cx="810" cy="235" r="4" class="node"/>
    <text x="820" y="238" class="label">+3.3V (VDD)</text>
    <text x="820" y="253" class="label-small">Logic power</text>
    <text x="820" y="267" class="value">From ESP32 3.3V pin</text>

    <!-- Decoupling capacitor note -->
    <g transform="translate(870, 310)">
        <use href="#cap-v"/>
        <text x="20" y="0" class="label">C1, C2</text>
        <text x="20" y="13" class="value">100µF</text>
        <text x="20" y="26" class="label-small">VMOT decoupling</text>
    </g>

    <!-- Notes section -->
    <rect x="50" y="610" width="900" height="70" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
    <text x="70" y="632" class="label" style="font-weight: 700;">Configuration & Performance:</text>
    <text x="70" y="650" class="label-small">• Microstepping: 1/16 step (3200 steps/rev) for smooth motion • Current limit: 1.2A/phase (set via potentiometer) • Step frequency: up to 20 kHz (limited by acceleration profile)</text>
    <text x="70" y="667" class="label-small">• VMOT decoupling: 100µF electrolytic per driver (close to VMOT pin) prevents voltage sag during step transitions • Heatsinks required above 1A continuous operation</text>
</svg>
