<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenzies Game — Project Write-up</title>
    <style>
        :root {
            --bg: #fafafa;
            --ink: #0a0a0a;
            --muted: #666666;
            --line: #e4e4e7;
            --surface: #ffffff;
            --surface-alt: #f4f4f5;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,.1);
        }
        
        [data-theme="dark"] {
            --bg: #0f0f0f;
            --ink: #fafafa;
            --muted: #a1a1aa;
            --line: #27272a;
            --surface: #18181b;
            --surface-alt: #27272a;
            --shadow: 0 1px 3px rgba(0,0,0,.3);
        }
        
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            color: var(--ink);
            background: var(--bg);
            font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--muted);
            text-decoration: none;
            padding: 8px 0;
        }
        .back-link:hover {
            color: var(--ink);
        }
        h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 20px; }
        .project-links { display: flex; gap: 12px; margin-bottom: 40px; }
        .project-links a {
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--ink);
            transition: background 0.2s ease;
        }
        .project-links a:hover {
            background: var(--surface-alt);
        }
        .content {
            line-height: 1.7;
        }
        .highlight-box, .warning-box {
            border-radius: var(--radius);
            margin: 20px 0;
            padding: 20px;
        }
        .highlight-box {
            background: var(--surface);
            border: 1px solid var(--line);
        }
        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffecb5;
            color: #856404;
        }
        [data-theme="dark"] .warning-box {
            background: #2d1b06;
            border: 1px solid #664d03;
            color: #ffecb5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }
        th {
            color: var(--ink);
        }
        td {
            color: var(--muted);
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--muted);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }
        .theme-toggle:hover {
            background: var(--surface-alt);
            color: var(--ink);
        }
        .theme-toggle svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <!-- Theme toggle button -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"></button>

    <div class="container">
        <a href="main.html" class="back-link">← Back to Portfolio</a>
        <h1>Tenzies Game — Project Write-up</h1>
        <div class="project-links">
            <a href="https://github.com/promaaa/tenzies" target="_blank" rel="noopener">View Code</a>
        </div>
        <div class="content">
            <!-- Content unchanged... -->
        </div>
    </div>

    <script>
    (function(){
        const toggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const icons = {
            light: `<svg viewBox="0 0 16 16"><rect x="5" y="2" width="6" height="1"/><rect x="3" y="3" width="10" height="1"/><rect x="2" y="4" width="12" height="1"/><rect x="2" y="5" width="12" height="6"/><rect x="2" y="11" width="12" height="1"/><rect x="3" y="12" width="10" height="1"/><rect x="5" y="13" width="6" height="1"/><rect x="4" y="6" width="2" height="1"/><rect x="4" y="7" width="2" height="1"/><rect x="9" y="8" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/><rect x="6" y="9" width="2" height="1"/><rect x="6" y="10" width="2" height="1"/></svg>`,
            dark: `<svg viewBox="0 0 16 16"><rect x="7" y="0" width="2" height="2"/><rect x="13" y="2" width="2" height="2"/><rect x="14" y="7" width="2" height="2"/><rect x="13" y="12" width="2" height="2"/><rect x="7" y="14" width="2" height="2"/><rect x="2" y="12" width="2" height="2"/><rect x="0" y="7" width="2" height="2"/><rect x="2" y="2" width="2" height="2"/><rect x="5" y="5" width="6" height="6"/></svg>`
        };
        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            toggle.innerHTML = icons[theme];
            toggle.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        }
        const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        setTheme(saved);
        toggle.addEventListener('click', () => setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    })();
    </script>
</body>
</html>
