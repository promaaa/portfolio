<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Essays — Marc Duboc</title>
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{
      --bg:#f7f7fb; --ink:#0a0a0e; --muted:#5e5e69; --line:rgba(0,0,0,.08);
      --surface:rgba(255,255,255,.7); --surface-alt:rgba(255,255,255,.85);
      --glass-border:rgba(0,0,0,.08); --blur:10px; --radius:14px;
    }
    [data-theme="dark"]{
      --bg:#0b0e16; --ink:#f7f7fb; --muted:#b5b7c8; --line:rgba(255,255,255,.12);
      --surface:rgba(255,255,255,.06); --surface-alt:rgba(255,255,255,.1);
      --glass-border:rgba(255,255,255,.18);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;color:var(--ink);font:16px/1.65 ui-sans-serif,system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial;background:var(--bg)}
    a{color:inherit;text-decoration:none}
    .container{max-width:900px;margin:0 auto;padding:60px 24px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    .top-actions{display:flex;align-items:center;gap:8px}
    .back{font-size:.9rem;color:var(--muted)}
    .theme-toggle{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:background .2s ease}
    .theme-toggle:hover{background:var(--line)}
    .theme-toggle svg{width:18px;height:18px;fill:currentColor}
    h1{font-size:clamp(28px,4vw,46px);margin:0 0 8px}
    p.lead{margin:0 0 24px;color:var(--muted)}
    .list{display:flex;flex-direction:column;gap:14px;margin-top:28px}
    .item{display:flex;flex-direction:column;padding:16px 18px;border:1px solid var(--glass-border);border-radius:12px;background:var(--surface);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}
    .item h3{margin:0 0 6px;font-size:18px}
    .meta{font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="container">
    <div class="top">
      <a class="back" href="main.html">← Back</a>
      <div class="top-actions">
        <span style="color:var(--muted)">Marc Duboc</span>
        <button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode"></button>
      </div>
    </div>
    <h1>Essays</h1>
    <p class="lead">Selected notes and essays on engineering, systems, and craft.</p>

    <div class="list">
      <a class="item" href="essay-collapse-of-money.html" target="_self">
        <h3>The Collapse of Money – A Journey Through the History of Exchange</h3>
        <div class="meta">Essay</div>
      </a>
      <a class="item" href="#" target="_self">
        <h3>Interfaces that teach</h3>
        <div class="meta">Draft • coming soon</div>
      </a>
    </div>
  </div>
  <script>
  (function(){
    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    const initial = saved ? saved : 'light';
    html.setAttribute('data-theme', initial);
    updateToggleIcon(initial);
    toggle.addEventListener('click', function(){
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateToggleIcon(next);
    });
    function updateToggleIcon(theme){
      const sunSvg = `<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <rect x="7" y="0" width="2" height="2"/>
      <rect x="13" y="2" width="2" height="2"/>
      <rect x="14" y="7" width="2" height="2"/>
      <rect x="13" y="12" width="2" height="2"/>
      <rect x="7" y="14" width="2" height="2"/>
      <rect x="2" y="12" width="2" height="2"/>
      <rect x="0" y="7" width="2" height="2"/>
      <rect x="2" y="2" width="2" height="2"/>
      <rect x="5" y="5" width="6" height="6"/>
      <rect x="6" y="4" width="4" height="1"/>
      <rect x="4" y="6" width="1" height="4"/>
      <rect x="11" y="6" width="1" height="4"/>
      <rect x="6" y="11" width="4" height="1"/>
    </svg>`;
      const moonSvg = `<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
      <rect x="8" y="2" width="8" height="2"/>
      <rect x="7" y="4" width="10" height="2"/>
      <rect x="6" y="6" width="11" height="2"/>
      <rect x="6" y="8" width="11" height="2"/>
      <rect x="6" y="10" width="11" height="2"/>
      <rect x="7" y="12" width="10" height="2"/>
      <rect x="8" y="14" width="8" height="2"/>
      <rect x="12" y="4" width="7" height="2" fill=\"var(--bg)\"/>
      <rect x="13" y="6" width="7" height="2" fill=\"var(--bg)\"/>
      <rect x="13" y="8" width="7" height="2" fill=\"var(--bg)\"/>
      <rect x="13" y="10" width="7" height="2" fill=\"var(--bg)\"/>
      <rect x="12" y="12" width="7" height="2" fill=\"var(--bg)\"/>
    </svg>`;
      toggle.innerHTML = theme === 'dark' ? sunSvg : moonSvg;
      toggle.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      toggle.setAttribute('aria-label', toggle.title);
    }
  })();
  </script>
</body>
</html>
